name: classify_swin3d_xlight
# swin3d (ViT) encoder, size=xlight — see kadd/classify/model.py SWIN3D_XLIGHT_KWARGS
# (custom config below torchvision's smallest canned "tiny", no pretrained weights
# exist for this shape). Same data setup as v2 (silver labels, gold held out as val).
#
# batch_size/max_series/gradient_accumulation_steps below are TUNING STARTING
# POINTS, not independently verified on real GPU hardware — this project's only
# confirmed-safe datapoint is the 'light' tier (swin3d_t) at batch_size=2,
# max_series=8 on 2x Tesla T4 (CLAUDE.md sec 7, Attempt 5 + the v2 42-min run
# before it hit the corrupted-DICOM bug, not an OOM). xlight is the smallest/
# narrowest encoder of the 4 tiers, so batch_size/max_series are scaled UP from
# that anchor; the actual ceiling should be read off the new per-epoch GPU
# memory log (kadd/classify/train.py's _log_gpu_memory) on the next real run and
# these numbers adjusted accordingly.

classify:
  model:
    type: swin3d
    size: xlight            # xlight | light | medium | large
    pretrained: false        # no pretrained weights exist for this custom shape — must stay false
    summary_dim: 256
    meta_dim: 16
    use_checkpointing: true
    proj_dropout: 0.1

  data:
    data_path: data/train_series/
    labels_csv: data/train.csv
    series_csv: data/train_series.csv
    label_columns: [ACL, MCL, "Medial Meniscus", "Lateral Meniscus", "Medial OA",
                     "Lateral OA", "PF OA", Effusion, Synovitis, "Baker's",
                     Contusion, Fracture]
    gold_only: false
    use_silver_labels: true
    silver_labels_csv: data/report_labels_llm.csv
    sub_epoch_size: 300               # subsample this many studies/epoch (redrawn each epoch) instead of
                                   #   all ~4,349 — real per-study DICOM load time is unmeasured
                                   #   beyond the diagnostic's bare-load 0.67s/3d-image (windowing/
                                   #   crop/resize add more); tune this once a real epoch completes
                                   #   and its wall-clock is known. See kadd/classify/train.py
                                   #   _make_train_loader and CLAUDE.md sec 9.
    max_series: 10           # smallest encoder in the family -> can afford more series/study
    target_depth: 32
    target_size: 224
    val_split: 0.2            # unused when use_silver_labels=True (val = all gold studies)
    num_workers: 4

  train:
    epochs: 100
    batch_size: 4              # 2 studies/GPU across 2 T4s — see tuning note above
    lr: 1.0e-5
    optimizer: AdamW
    weight_decay: 0.01
    scheduler: ReduceLROnPlateau
    scheduler_params:
      factor: 0.3
      patience: 10
      min_lr: 1.0e-7
    gradient_accumulation_steps: 2   # effective batch ~8, matching the light-tier baseline
    grad_clip: 1.0
    patience: 20
