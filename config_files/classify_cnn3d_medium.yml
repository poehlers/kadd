name: classify_cnn3d_medium
# cnn3d encoder, size=medium (channels 1->64->128->256->512, see
# kadd/classify/model.py CNN3D_CHANNELS — double the width of 'light' at the
# same depth, which reached a real, verified 0.7095 best macro-AUC — see
# classify_cnn3d_light.yml / CLAUDE.md sec 7). Wider first-block channel
# count (64 vs 32) means a larger dense activation before the first stride-2
# downsample.
#
# REAL TRAINING CONFIG as of 2026-08-27, promoted from a resource-probe
# phase (batch_size=2->12, max_series=8->14) per the user's explicit
# process — see feedback_resource_probing_process memory:
#   1. 3-epoch probe at batch_size=2/max_series=8 (sub_epoch_size=300):
#      GPU 0/1 reserved=1.80GB/1.46GB of 15.64GB (11.5%/9.3% real reserved
#      fraction — the logged peak_allocated-based "7%/6%" understates it).
#      Huge headroom.
#   2. Jumped to batch_size=12/max_series=14 in one reasoned step (linear
#      projection predicted ~53% reserved). Real 3-epoch reading came back
#      at GPU 0 reserved=14.47GB (92.5%!) — the linear projection was badly
#      wrong; memory scaling is non-linear at this size, and GPU 0 runs
#      structurally hotter than GPU 1 under multi-GPU study-sharding (holds
#      the un-replicated model, gathers every shard's output).
#   3. Rather than trust a single risky 3-epoch reading, ran a 20-epoch
#      stress test at the SAME batch_size=12/max_series=14 (still
#      sub_epoch_size=300, for cheap iteration — sub_epoch_size only
#      changes step COUNT per epoch, not per-step memory/compute, so this
#      transfers directly to the full-dataset run). Result: peak reserved
#      GPU 0=13.34GB (85.3%), GPU 1=11.49GB (73.5%) — LOWER than the 3-epoch
#      probe's spike (that reading was an unlucky random draw, not the true
#      ceiling), and flat/stable for 17 straight epochs (4-20) across 20
#      different random subsamples, with zero OOM. Real, repeated evidence
#      of a stable steady state, not a guess.
# Now switched to the real training setup: sub_epoch_size: false (full
# ~4,349-study dataset every epoch, matching what worked for cnn3d/light)
# and epochs: 100.

classify:
  model:
    type: cnn3d
    size: medium               # xlight | light | medium | large
    summary_dim: 256
    meta_dim: 16
    use_checkpointing: true

  data:
    data_path: data/train_series/
    labels_csv: data/train.csv
    series_csv: data/train_series.csv
    label_columns: [ACL, MCL, "Medial Meniscus", "Lateral Meniscus", "Medial OA",
                     "Lateral OA", "PF OA", Effusion, Synovitis, "Baker's",
                     Contusion, Fracture]
    gold_only: false
    use_silver_labels: true
    silver_labels_csv: data/report_labels_llm.csv
    sub_epoch_size: false          # false (full dataset every epoch) for the real run — see file header.
                                   #   Probing used 300 for fast iteration only; per the orthogonality
                                   #   finding (feedback_resource_probing_process), the batch_size/
                                   #   max_series validated under sub_epoch_size=300 carry over
                                   #   unchanged here.
    precomputed_dir: data/precomputed
    max_series: 14                 # true per-study ceiling (train_series.csv range is 3-14) — no
                                    #   study is ever truncated at this value.
    target_depth: 32
    target_size: 224
    val_split: 0.2
    num_workers: 4

  train:
    epochs: 100                    # real run — early stopping (patience below) decides when it's done,
                                    #   matching cnn3d/light's successful 56-epoch run.
    batch_size: 12                 # validated safe by a 20-epoch stress test — see file header.
    lr: 1.0e-5
    optimizer: AdamW
    weight_decay: 0.01
    scheduler: ReduceLROnPlateau
    scheduler_params:
      factor: 0.3
      patience: 10
      min_lr: 1.0e-7
    gradient_accumulation_steps: 4
    grad_clip: 1.0
    patience: 20
