name: classify_swin3d_v2

classify:
  model:
    type: swin3d          # swin3d (ViT) | cnn3d
    size: light            # xlight | light | medium | large — see model.py
    pretrained: false      # Kinetics-400 weights; only reuses deeper blocks, see model.py docstring
    summary_dim: 256
    meta_dim: 16
    use_checkpointing: true
    proj_dropout: 0.1

  data:
    data_path: data/train_series/       # bulk DICOM tree: <StudyInstanceUID>/<SeriesInstanceUID>/*.dcm
    labels_csv: data/train.csv
    series_csv: data/train_series.csv
    label_columns: [ACL, MCL, "Medial Meniscus", "Lateral Meniscus", "Medial OA",
                     "Lateral OA", "PF OA", Effusion, Synovitis, "Baker's",
                     Contusion, Fracture]
    gold_only: false             # v2: train on report-derived silver labels, not just the 58 gold studies
    use_silver_labels: true
    silver_labels_csv: data/report_labels_llm.csv   # 4,349 studies, see CLAUDE.md sec 8
                                  # (58 gold studies held out entirely as a clean, never-trained-on
                                  #  val set — see KneeDataLoader docstring)
    sub_epoch_size: 300               # subsample this many studies/epoch (redrawn each epoch) instead of
                                   #   all ~4,349 — real per-study DICOM load time is unmeasured
                                   #   beyond the diagnostic's bare-load 0.67s/3d-image (windowing/
                                   #   crop/resize add more); tune this once a real epoch completes
                                   #   and its wall-clock is known. See kadd/classify/train.py
                                   #   _make_train_loader and CLAUDE.md sec 9.
    max_series: 8                 # cap on series/study fed to attention-MIL pooling (max seen locally: 14)
    target_depth: 32
    target_size: 224
    val_split: 0.2                # unused when use_silver_labels=True (val = all gold studies)
    num_workers: 4

  train:
    epochs: 100
    batch_size: 2            # 1 study/GPU if 2 GPUs are visible (see train.py's multi-GPU
                              #   study-sharding docstring). If only 1 GPU is visible, drop to 1
                              #   (confirmed OOM fix at batch_size=1 in v1's Kaggle run).
    lr: 1.0e-5
    optimizer: AdamW
    weight_decay: 0.01
    scheduler: ReduceLROnPlateau
    scheduler_params:
      factor: 0.3
      patience: 10
      min_lr: 1.0e-7
    gradient_accumulation_steps: 4
    grad_clip: 1.0
    patience: 20
