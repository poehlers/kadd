name: classify_cnn3d_large
# cnn3d encoder, size=large (channels 1->64->128->256->512->1024, 5 conv
# blocks — see kadd/classify/model.py CNN3D_CHANNELS). Same first-block width
# as medium (64ch) but one block deeper and wider at the tail, so this trims
# max_series further rather than the first-block dense-activation cost (which
# is unchanged from medium). Not independently verified on real hardware —
# read the per-epoch GPU memory log (kadd/classify/train.py _log_gpu_memory)
# on the first real run and adjust.

classify:
  model:
    type: cnn3d
    size: large                # xlight | light | medium | large
    summary_dim: 256
    meta_dim: 16
    use_checkpointing: true

  data:
    data_path: data/train_series/
    labels_csv: data/train.csv
    series_csv: data/train_series.csv
    label_columns: [ACL, MCL, "Medial Meniscus", "Lateral Meniscus", "Medial OA",
                     "Lateral OA", "PF OA", Effusion, Synovitis, "Baker's",
                     Contusion, Fracture]
    gold_only: false
    use_silver_labels: true
    silver_labels_csv: data/report_labels_llm.csv
    sub_epoch_size: 300               # subsample this many studies/epoch (redrawn each epoch) instead of
                                   #   all ~4,349 — real per-study DICOM load time is unmeasured
                                   #   beyond the diagnostic's bare-load 0.67s/3d-image (windowing/
                                   #   crop/resize add more); tune this once a real epoch completes
                                   #   and its wall-clock is known. See kadd/classify/train.py
                                   #   _make_train_loader and CLAUDE.md sec 9.
    max_series: 6
    target_depth: 32
    target_size: 224
    val_split: 0.2
    num_workers: 4

  train:
    epochs: 100
    batch_size: 2
    lr: 1.0e-5
    optimizer: AdamW
    weight_decay: 0.01
    scheduler: ReduceLROnPlateau
    scheduler_params:
      factor: 0.3
      patience: 10
      min_lr: 1.0e-7
    gradient_accumulation_steps: 6
    grad_clip: 1.0
    patience: 20
